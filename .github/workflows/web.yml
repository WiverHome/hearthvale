# Веб-версия на GitHub Pages: собирается при выпуске (GitHub Release) или вручную
name: web

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :web:gdx_teavm_web_js_build
      - run: |
          rm -rf web/build/dist/js/webapp/WEB-INF
          touch web/build/dist/js/webapp/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/build/dist/js/webapp

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
